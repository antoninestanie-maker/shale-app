# ─────────────────────────────────────────────────────────────────────────────
# Publie une version macOS de Shale : compile les deux architectures, leur donne
# un NOM STABLE, et crée la release GitHub.
#
# Se déclenche à la main (onglet « Actions » du dépôt) — pas à chaque push :
# une version se publie quand on l'a décidé, pas quand on a corrigé une virgule.
#
# CE DÉPÔT RESTE PRIVÉ. La release ne part donc PAS ici mais dans un second
# dépôt, public et vide de code (`DEPOT_TELECHARGEMENTS` ci-dessous), qui ne sert
# qu'à héberger les binaires : un dépôt privé ne sert ses fichiers de release
# qu'aux comptes qui y ont accès, un visiteur anonyme reçoit un 404.
#
# Les fichiers de release ne vivent pas dans l'historique git — ce sont des
# objets séparés. Le dépôt public ne grossit donc pas d'une version à l'autre,
# contrairement à ce qui arriverait en committant les .dmg quelque part.
#
# L'écriture dans cet autre dépôt demande un jeton personnel, stocké en secret
# de dépôt sous le nom DOWNLOADS_TOKEN. Le `GITHUB_TOKEN` automatique ne
# convient pas : sa portée s'arrête au dépôt courant.
#
# POURQUOI RENOMMER. Tauri horodate ses fichiers avec la version
# (« Shale_0.1.0_aarch64.dmg »). Or le site pointe sur
# `releases/latest/download/<nom>`, une URL qui exige un nom FIGÉ : si le nom
# bouge à chaque version, tous les boutons de téléchargement du site cassent le
# jour de la publication suivante. On copie donc sous « Shale_aarch64.dmg » et
# « Shale_x64.dmg », les noms attendus par `config.dmgApple` et `config.dmgIntel`
# dans shale-site/vitrine/src/content.json.
#
# NON SIGNÉ, NON NOTARISÉ. Aucun certificat Apple n'est configuré ici. Les .dmg
# produits déclencheront un avertissement Gatekeeper chez le visiteur. Pour y
# remédier il faudra un compte Apple Developer et quatre secrets de dépôt
# (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID),
# puis leur ajout à l'étape « Compiler » ci-dessous.
# ─────────────────────────────────────────────────────────────────────────────
name: Publier une version macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version, sans le « v » (ex. 0.1.0)"
        required: true
        default: "0.1.0"

env:
  # Le dépôt public qui héberge les .dmg. Doit rester ALIGNÉ avec
  # `config.githubRepo` dans shale-site/vitrine/src/content.json : c'est de là
  # que le site construit ses URL de téléchargement.
  DEPOT_TELECHARGEMENTS: antoninestanie-maker/shale-downloads

jobs:
  publier:
    runs-on: macos-14
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer Rust et les deux cibles macOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Installer les dépendances
        run: npm ci

      # `beforeBuildCommand` de tauri.conf.json lance déjà `npm run build` :
      # le front n'a pas d'étape à lui ici.
      - name: Compiler pour Apple Silicon
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Compiler pour Intel
        run: npm run tauri build -- --target x86_64-apple-darwin

      - name: Renommer sous les noms attendus par le site
        run: |
          mkdir -p release
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release/Shale_aarch64.dmg
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg release/Shale_x64.dmg
          ls -lh release/

      # `prerelease: false` n'est pas décoratif : `releases/latest` IGNORE les
      # pre-releases et les brouillons. Publiée en pre-release, la version
      # donnerait un 404 exactement comme si elle n'existait pas.
      #
      # `repository` + `token` : la release atterrit dans le dépôt PUBLIC de
      # téléchargement, pas ici. Sans ces deux lignes elle serait créée dans ce
      # dépôt-ci, qui est privé — et donc invisible aux visiteurs.
      - name: Publier la release dans le dépôt public
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.DEPOT_TELECHARGEMENTS }}
          token: ${{ secrets.DOWNLOADS_TOKEN }}
          tag_name: v${{ inputs.version }}
          name: Shale ${{ inputs.version }}
          body: |
            Version ${{ inputs.version }} de Shale pour macOS 14+.

            - `Shale_aarch64.dmg` — Mac Apple Silicon (M1 et suivants)
            - `Shale_x64.dmg` — Mac Intel
          files: release/*.dmg
          draft: false
          prerelease: false
