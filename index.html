<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` : sans lui, iOS réserve lui-même les marges de
         l'encoche et de la barre d'accueil, et `env(safe-area-inset-*)` renvoie
         toujours 0 — la barre d'onglets flotterait au-dessus d'un bandeau vide.
         `maximum-scale=1` empêche le zoom involontaire au double-tap sur un champ.
         Sans effet sur le bureau. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>Shale</title>
    <script>
      /* ⭐ LE THÈME EST POSÉ ICI, AVANT LE PREMIER PAINT.
         C'est la seule raison d'être de ce script, et il doit rester le premier
         exécutable de la page.

         Le thème vit dans `settings` en SQLite (clé `ui.theme`), donc il est lu
         APRÈS le montage de React — et sur l'écran de connexion il n'est pas lu
         du tout : rien ne touche la base avant l'authentification (voir
         `ChassisFactice.tsx`). Sans ce script, quelqu'un qui a choisi « Clair »
         traversait tout le mur de connexion en sombre, puis basculait.

         Le miroir `shale.theme.resolved` est écrit par `applyTheme()`
         (`src/lib/theme.ts`) ; SQLite reste la source de vérité.

         ⚠️ Le miroir est ABSENT quand le réglage vaut « Système », exprès :
         rejouer « la dernière fois, le système était sombre » serait faux dès
         que macOS a changé d'apparence entre deux lancements. `prefers-color-scheme`,
         lui, est lu en direct.

         ⚠️ Le fond en ligne posé ci-dessous n'est qu'un CALAGE, pour la fenêtre
         où la feuille de style n'est pas encore appliquée (en mode démo, Vite
         l'injecte par JS : la première frame est celle du HTML nu, donc blanche).
         `main.tsx` le retire juste après l'import du CSS et rend la main à la
         feuille de style — sans quoi un style en ligne gagnerait pour toujours
         sur `@layer base`, et le thème « Système » cesserait de suivre macOS en
         direct.

         ⚠️ Les deux couleurs sont recopiées de `--color-bg` (`src/index.css`).
         `src/lib/theme.premier-paint.test.ts` échoue si une copie dérive. */
      (function () {
        var FONDS = { dark: "#030304", light: "#ffffff" };
        var choix = null;
        try {
          choix = localStorage.getItem("shale.theme.resolved");
        } catch (e) {
          /* Navigation privée ou stockage refusé : le système décidera. */
        }
        var racine = document.documentElement;
        var explicite = choix === "dark" || choix === "light";
        if (explicite) racine.setAttribute("data-theme", choix);
        var clair =
          !explicite &&
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches;
        racine.style.backgroundColor = FONDS[explicite ? choix : clair ? "light" : "dark"];
      })();
    </script>
    <style>
      /* ⭐ LE LANCEMENT — la première image de Shale, peinte AVANT tout CSS.
         C'est la même image que l'écran de lancement d'iOS
         (`src-tauri/gen/apple/LaunchScreen.storyboard`) et que le premier temps
         de l'animation d'entrée : fond nuit, halo rouge, l'icône au centre,
         SANS lueur. Un seul logo du clic sur l'icône jusqu'à l'app.

         En ligne et pas dans `index.css` parce que la feuille de style n'est
         pas encore là au premier paint (en mode démo, Vite l'injecte par JS).
         React rend ensuite le même balisage (`Lancement` dans `AuthGate.tsx`)
         et `main.tsx` retire celui-ci.

         ⚠️ Couleurs, halo et côté recopiés : `--marque-nuit` (`src/index.css`),
         `HALO` / `COTE_HALO` / `COTE_LANCEMENT` (`tools/icones-marque.mjs`),
         `LaunchBackground` (catalogue iOS), `backgroundColor`
         (`tauri.conf.json`). `src/lib/entree/lancement.test.ts` échoue si une
         copie dérive.
         `--zoom-inv` (densité, Dynamic Type) n'existe pas encore ici : il vaut 1.
         Quand l'app le pose, il garde à l'icône sa taille À L'ÉCRAN. */
      .lancement {
        position: fixed;
        inset: 0;
        background: #070506;
        overflow: hidden;
      }
      .lancement-icone {
        position: absolute;
        inset: 0;
        margin: auto;
      }
      /* ⚠️ Le halo est plus large qu'un téléphone (560 contre 390) : centré par
         `margin: auto`, une boîte plus grande que son parent se colle à gauche
         (la marge négative est donnée à droite). Centré par le calcul. */
      .lancement-halo {
        position: absolute;
        left: calc(50% - 280px * var(--zoom-inv, 1));
        top: calc(50% - 280px * var(--zoom-inv, 1));
        width: calc(560px * var(--zoom-inv, 1));
        height: calc(560px * var(--zoom-inv, 1));
        background: radial-gradient(closest-side, rgb(220 38 38 / 0.16), rgb(220 38 38 / 0.05) 55%, rgb(220 38 38 / 0) 100%);
      }
      .lancement-icone {
        width: calc(96px * var(--zoom-inv, 1));
        height: calc(96px * var(--zoom-inv, 1));
      }
    </style>
  </head>

  <body>
    <!-- La première image : voir `.lancement` plus haut. Retirée par `main.tsx`. -->
    <div id="lancement" class="lancement" aria-hidden="true">
      <div class="lancement-halo"></div>
      <svg class="lancement-icone" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lancement-plaque" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient></defs><rect width="100" height="100" rx="22.5" fill="url(#lancement-plaque)"/><rect x="0.6" y="0.6" width="98.8" height="98.8" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2"/><g transform="translate(12.47 0) skewX(-14)" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="butt"><path d="M86 38 H54 Q42 38 42 53"/><path d="M14 62 H46 Q58 62 58 47"/></g></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
