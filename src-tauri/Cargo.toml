[package]
name = "shale"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2.7.1"
# `url` : décoder le `file:///…` que le sélecteur de photos d'iOS rend à la
# place d'un chemin (voir `import_screenshot`). Déjà dans l'arbre via
# `tauri-plugin-fs` et `tauri` lui-même — aucune dépendance compilée en plus.
url = "2"
tauri-plugin-http = "2"
# Notifications intelligentes (src/notifications/) : `chrono` pour l'heure locale,
# `sqlx` pour lire shale.db EN LECTURE SEULE depuis le Rust (le front reste seul
# écrivain de la base). Les deux sont déjà dans l'arbre via tauri-plugin-sql —
# on aligne juste les features, sans nouvelle dépendance compilée.
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
# `time` seulement : le planificateur ne veut que `sleep`, l'exécuteur est celui
# de Tauri (`tauri::async_runtime`, lui-même bâti sur tokio).
tokio = { version = "1", features = ["time"] }
# Dérivation de clé (src/crypto.rs) : Argon2id, pour transformer un mot de passe
# ou une phrase de récupération en clé de chiffrement. WebCrypto ne propose PAS
# Argon2 — seulement PBKDF2, bien plus faible face à un attaquant équipé de GPU
# (Argon2 est coûteux en MÉMOIRE, ce qui neutralise l'avantage du parallélisme).
# D'où ce passage par le Rust pour la seule opération sensible, rare (une fois
# par session) et jamais sur le chemin critique d'une écriture.
argon2 = "0.5"

# `time` — UNIQUEMENT pour parler au greffon de notifications, dont
# `Schedule::At` expose un `time::OffsetDateTime` dans sa signature publique.
# Aucune nouvelle compilation : la crate est déjà dans l'arbre, tirée par ce
# même greffon. Tout le reste du code date continue d'utiliser `chrono`.
time = "0.3"

# Trousseau système (src/secrets.rs) : range les clés d'API LLM chiffrées au repos
# plutôt qu'en clair dans shale.db.
#
# ⚠️ Dépendance PAR PLATEFORME, et pas une seule ligne avec les deux features :
# `apple-native` et `windows-native` tirent chacune des crates natives qui ne
# compilent QUE sur leur système (Security.framework d'un côté, windows-sys de
# l'autre). Les activer ensemble casserait les deux cibles à la fois.
# Le code de `secrets.rs`, lui, est identique partout : l'API `keyring::Entry`
# est la même, seul le coffre derrière change (Keychain / Credential Manager).
# ⚠️ iOS partage `apple-native` avec macOS, et c'est vérifié dans la crate, pas
# supposé : `keyring` 3.6.3 contient `src/ios.rs` à côté de `src/macos.rs`, et
# déclare `security-framework` pour `cfg(target_os = "ios")` autant que pour
# macOS. La feature est donc la MÊME ; seul le coffre derrière change.
# Sans ce `any(...)`, la crate est absente sur iOS et `secrets.rs` ne compile pas.
#
# ⚠️ Contrainte propre à iOS, écrite dans l'en-tête de son `ios.rs` : ni le
# service ni le compte ne peuvent être la chaîne vide. `Entry::new(SERVICE, key)`
# les renseigne tous deux — rien à changer, mais rien à relâcher non plus.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"

