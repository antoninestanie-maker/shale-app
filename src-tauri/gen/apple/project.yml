name: shale
options:
  bundleIdPrefix: com.atnfx.shale
  deploymentTarget:
    # 17.0 depuis le 2026-10-06 (était 14.0). L'app n'a jamais tourné que sous
    # iOS 26, et son affichage repose sur des fonctions de WebKit arrivées entre
    # iOS 16.2 et 17 (`color-mix`, entre autres) : promettre iOS 14 à l'App Store
    # aurait livré une app aux couleurs cassées sur des téléphones jamais essayés.
    # Doit rester égal à `bundle.iOS.minimumSystemVersion` de `tauri.conf.json`.
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Shale
      PRODUCT_BUNDLE_IDENTIFIER: com.atnfx.shale
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  shale_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # ⚠️ `excludes` obligatoire, et ce n'est pas cosmétique. `Externals`
      # accueille `libapp.a`, produit PAR le build. Régénérer le projet après
      # un premier build faisait donc classer cette archive statique en
      # RESSOURCE, et XcodeGen la recopiait dans le bundle — plusieurs dizaines
      # de mégaoctets embarqués pour rien. Le lien, lui, ne passe pas par là :
      # il vient de `dependencies: framework: libapp.a` et des
      # `LIBRARY_SEARCH_PATHS` ci-dessous.
      - path: Externals
        excludes: ["**/*.a"]
      - path: shale_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      # Manifeste de confidentialité exigé par Apple à l'envoi (MOBILE.md § 28).
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: shale_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 0.8.0 depuis le 2026-10-07 (décision d'Antonin). Le numéro vit AUSSI
        # dans `tauri.conf.json`, `Cargo.toml` et `package.json` : les quatre
        # bougent ensemble.
        CFBundleShortVersionString: 0.8.0
        CFBundleVersion: "0.8.0"
        # L'app parle français ET anglais : sans ces deux clés, iOS prend l'app
        # pour anglophone et les menus système de la WebView (Copier, Coller,
        # Rechercher…) sortent en anglais sur un iPhone français. PIEGES § 19.14.
        CFBundleLocalizations: [en, fr]
        CFBundleAllowMixedLocalizations: true
        # « Insérer une image » ouvre le sélecteur d'iOS, qui propose « Prendre
        # une photo ». Sans ce texte, iOS FERME l'app à ce moment-là. La version
        # française est dans `shale_iOS/fr.lproj/InfoPlist.strings`.
        NSCameraUsageDescription: Shale uses the camera to add a photo to a note or a page.
    entitlements:
      path: shale_iOS/shale_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        # ⚠️ Ajouté à la main le 2026-08-27, et à REMETTRE si `tauri ios init`
        # régénère ce fichier : sans équipe déclarée, xcodebuild refuse la cible
        # device dès `GatherProvisioningInputs` — AVANT toute compilation, et
        # sans que `CODE_SIGNING_ALLOWED=NO` y change quoi que ce soit.
        # `QXU2BNU373` est la Personal Team GRATUITE d'Antonin : profil de
        # 7 jours, renouvelable en rebranchant. `Automatic` est obligatoire —
        # une équipe gratuite n'a pas de profil manuel à télécharger.
        DEVELOPMENT_TEAM: QXU2BNU373
        CODE_SIGN_STYLE: Automatic
        # ⚠️ Ajouté à la main, et à REMETTRE si `tauri ios init` régénère ce
        # fichier : la cible contient désormais du Swift
        # (`Sources/shale/QuickNoteIntent.swift`, l'AppIntent du bouton
        # Action). Sans version de langage déclarée, Xcode refuse de compiler
        # une cible qui mélange Objective-C++ et Swift.
        SWIFT_VERSION: "5.0"
        # iPhone ET iPad (décision d'Antonin, 2026-10-07 ; « iPhone seul » avait
        # été préparé la veille). Conséquence côté App Store : des captures
        # iPad 13 pouces sont obligatoires, et Apple relit l'app sur iPad.
        # ⚠️ Une fois publiée ainsi, l'iPad ne se retire plus.
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a